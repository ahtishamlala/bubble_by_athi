name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean Configs & Configure Flutter
        run: |
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          rm -rf ios/Flutter/ephemeral
          flutter config --no-enable-swift-package-manager
          flutter precache --ios

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Application (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y Bubble_by_Athi.ipa Payload
          rm -rf Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: Bubble_by_Athi_iOS_IPA
          path: Bubble_by_Athi.ipa
          retention-days: 14
