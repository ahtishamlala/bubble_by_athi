name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache iOS Artifacts
        run: flutter precache --ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup & Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Application
        run: flutter build ios --release --no-codesign

      - name: Package IPA for Sideloading
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y Bubble_by_Athi.ipa Payload
          mv Bubble_by_Athi.ipa ../../../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bubble_by_Athi_iOS_IPA
          path: Bubble_by_Athi.ipa
          retention-days: 14
